name: Deploy GeoQuery

# Include [DEPLOY-X.Y.Z] in a geoquery commit message to trigger a release, e.g.:
#   git commit -m "feat: add thing [DEPLOY-0.14.6]"
# The most recent successful run of both build workflows on the branch must
# exist before the deploy proceeds. The version from the marker becomes the
# helm chart version.
on:
  workflow_run:
    workflows:
      - "Build backend container"
      - "Build frontend container"
    types: [completed]
  workflow_dispatch:
    inputs:
      chart_version:
        description: 'Helm chart version (e.g. 0.14.6)'
        required: true
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve context and check deploy marker
        id: ctx
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.chart_version }}"
            BRANCH="${{ github.ref_name }}"
            SHA=$(gh api "repos/${{ github.repository }}/git/refs/heads/${BRANCH}" \
              --jq '.object.sha')

          elif [ "${{ github.event_name }}" = "push" ]; then
            SHA="${{ github.sha }}"
            BRANCH="${{ github.ref_name }}"
            COMMIT_MSG=$(gh api "repos/${{ github.repository }}/commits/${SHA}" \
              --jq '.commit.message')
            VERSION=$(echo "$COMMIT_MSG" | grep -oP '\[DEPLOY-\K[0-9]+\.[0-9]+\.[0-9]+(?=\])' || true)
            if [ -z "$VERSION" ]; then
              echo "No [DEPLOY-X.Y.Z] marker in commit message — skipping."
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "Deploy marker found: [DEPLOY-${VERSION}]"

          else
            # workflow_run
            if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
              echo "Triggering build did not succeed — skipping."
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            SHA="${{ github.event.workflow_run.head_sha }}"
            BRANCH="${{ github.event.workflow_run.head_branch }}"
            COMMIT_MSG=$(gh api "repos/${{ github.repository }}/commits/${SHA}" \
              --jq '.commit.message')
            VERSION=$(echo "$COMMIT_MSG" | grep -oP '\[DEPLOY-\K[0-9]+\.[0-9]+\.[0-9]+(?=\])' || true)
            if [ -z "$VERSION" ]; then
              echo "No [DEPLOY-X.Y.Z] marker in commit message — skipping."
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "Deploy marker found: [DEPLOY-${VERSION}]"
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "sha=${SHA}" >> $GITHUB_OUTPUT
          echo "sha_short=${SHA:0:7}" >> $GITHUB_OUTPUT
          echo "branch=${BRANCH}" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image SHAs for each build
        if: steps.ctx.outputs.skip != 'true'
        id: builds
        run: |
          # Each build workflow only runs when its own paths change, so the two
          # images can legitimately be at different commit SHAs. Resolving the
          # "other" image (the one whose build didn't trigger this run) used to
          # ask for the most recent successful run *on the branch*, which is
          # wrong whenever that build is also running for this same commit:
          #
          #   0.46.0 shipped a stale backend. A commit touched both frontend and
          #   backend, so both builds ran. The frontend build finished first and
          #   its deploy asked "latest successful backend run on main" while the
          #   backend build for the same commit had only just completed -- the
          #   run-list endpoint still reported the *previous* one. The chart was
          #   published pinning a two-commit-old backend image, and because Flux
          #   deployed exactly what the chart asked for, every status stayed
          #   green while prod ran the wrong code.
          #
          # So ask about THIS COMMIT specifically instead of "latest on branch".
          # A build run's record exists from the moment the commit is pushed --
          # long before any build finishes and triggers a deploy -- so querying
          # by head_sha is not subject to that lag. The outcome for this commit
          # tells us what to do:
          #
          #   success     -> use this commit's image
          #   in progress -> SKIP. The deploy triggered when that build finishes
          #                  will run with both SHAs correct. This is what stops
          #                  the two builds of one commit from racing.
          #   failed      -> stop. Never ship half of a commit.
          #   no run      -> that build wasn't triggered by this commit (its
          #                  paths didn't change), so the branch's last
          #                  successful image is genuinely the right one.
          BRANCH="${{ steps.ctx.outputs.branch }}"
          SHA="${{ steps.ctx.outputs.sha }}"
          TRIGGER_WF_NAME="${{ github.event.workflow_run.name }}"

          for PAIR in "Build backend container:backend" "Build frontend container:frontend"; do
            WF_NAME="${PAIR%%:*}"
            KEY="${PAIR##*:}"

            WF_ID=$(gh api "repos/${{ github.repository }}/actions/workflows" \
              --jq ".workflows[] | select(.name == \"${WF_NAME}\") | .id")
            if [ -z "$WF_ID" ]; then
              echo "ERROR: workflow '${WF_NAME}' not found"
              exit 1
            fi

            # Newest run for this exact commit, if this build ran for it at all.
            THIS_COMMIT=$(gh api \
              "repos/${{ github.repository }}/actions/workflows/${WF_ID}/runs?head_sha=${SHA}&per_page=1" \
              --jq '.workflow_runs[0] | "\(.status):\(.conclusion)"' 2>/dev/null || echo "")

            if [ "$WF_NAME" = "$TRIGGER_WF_NAME" ]; then
              # This build is why we're here; its conclusion was already checked.
              RUN_SHA="$SHA"
              echo "${WF_NAME}: ${RUN_SHA:0:7} (triggered this deploy)"

            elif [ -z "$THIS_COMMIT" ] || [ "$THIS_COMMIT" = "null:null" ]; then
              RUN_SHA=$(gh api \
                "repos/${{ github.repository }}/actions/workflows/${WF_ID}/runs?branch=${BRANCH}&status=success&per_page=1" \
                --jq '.workflow_runs[0].head_sha // ""')
              echo "${WF_NAME}: ${RUN_SHA:0:7} (not built for ${SHA:0:7}; branch's last success)"

            elif [ "${THIS_COMMIT%%:*}" != "completed" ]; then
              echo "${WF_NAME} is still running for ${SHA:0:7} (${THIS_COMMIT})."
              echo "Skipping: the deploy triggered by its completion will ship this commit."
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0

            elif [ "${THIS_COMMIT##*:}" != "success" ]; then
              echo "ERROR: ${WF_NAME} did not succeed for ${SHA:0:7} (${THIS_COMMIT})."
              echo "Refusing to deploy a commit whose images are not all built."
              exit 1

            else
              RUN_SHA="$SHA"
              echo "${WF_NAME}: ${RUN_SHA:0:7} (succeeded for this commit)"
            fi

            if [ -z "$RUN_SHA" ]; then
              echo "ERROR: no successful '${WF_NAME}' run found on branch ${BRANCH}"
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi

            echo "${KEY}_sha=${RUN_SHA}" >> $GITHUB_OUTPUT
            echo "${KEY}_sha_short=${RUN_SHA:0:7}" >> $GITHUB_OUTPUT
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to reuse an already-published chart version
        if: steps.ctx.outputs.skip != 'true' && steps.builds.outputs.skip != 'true'
        run: |
          # helm-charts releases with chart-releaser's skip_existing: true, so
          # pushing new values at an already-published version is a SILENT
          # no-op: the git repo updates, the release artifact does not, and
          # Flux keeps serving the old one. That is how 0.46.0's stale backend
          # tag survived a corrective run that "succeeded". Catch it here --
          # a version that is already published can no longer be changed.
          VERSION="${{ steps.ctx.outputs.version }}"
          EXPECTED_BE="${{ steps.builds.outputs.backend_sha_short }}"
          EXPECTED_FE="${{ steps.builds.outputs.frontend_sha_short }}"
          URL="https://github.com/aiddata/helm-charts/releases/download/geoquery-${VERSION}/geoquery-${VERSION}.tgz"

          if ! curl -sfL "$URL" -o /tmp/published.tgz; then
            echo "Chart ${VERSION} is not published yet — safe to publish."
            exit 0
          fi

          tar xzf /tmp/published.tgz -C /tmp
          PUB_BE=$(grep -oP 'geoquery-backend:\K\S+' /tmp/geoquery/values.yaml || echo "?")
          PUB_FE=$(grep -oP 'geoquery-frontend:\K\S+' /tmp/geoquery/values.yaml || echo "?")

          if [ "$PUB_BE" = "$EXPECTED_BE" ] && [ "$PUB_FE" = "$EXPECTED_FE" ]; then
            echo "Chart ${VERSION} is already published with these exact images — nothing to do."
            exit 0
          fi

          echo "ERROR: chart ${VERSION} is already published, with different images:"
          echo "  published: backend=${PUB_BE} frontend=${PUB_FE}"
          echo "  wanted:    backend=${EXPECTED_BE} frontend=${EXPECTED_FE}"
          echo "chart-releaser will not overwrite it, so publishing would silently do nothing."
          echo "Use a new [DEPLOY-X.Y.Z] version."
          exit 1

      - name: Checkout helm-charts
        if: steps.ctx.outputs.skip != 'true' && steps.builds.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: aiddata/helm-charts
          token: ${{ secrets.DEPLOY_TOKEN }}
          path: helm-charts

      - name: Update Chart.yaml and values.yaml
        if: steps.ctx.outputs.skip != 'true' && steps.builds.outputs.skip != 'true'
        run: |
          VERSION="${{ steps.ctx.outputs.version }}"
          FRONTEND_SHA="${{ steps.builds.outputs.frontend_sha_short }}"
          BACKEND_SHA="${{ steps.builds.outputs.backend_sha_short }}"

          sed -i "s/^version:.*/version: ${VERSION}/" helm-charts/charts/geoquery/Chart.yaml
          sed -i "s|image: ghcr.io/aiddata/geoquery-frontend:.*|image: ghcr.io/aiddata/geoquery-frontend:${FRONTEND_SHA}|" \
            helm-charts/charts/geoquery/values.yaml
          sed -i "s|image: ghcr.io/aiddata/geoquery-backend:.*|image: ghcr.io/aiddata/geoquery-backend:${BACKEND_SHA}|" \
            helm-charts/charts/geoquery/values.yaml

          echo "Chart.yaml:" && grep '^version:' helm-charts/charts/geoquery/Chart.yaml
          echo "values.yaml:" && grep 'image: ghcr.io/aiddata/geoquery-' helm-charts/charts/geoquery/values.yaml

      - name: Commit and push helm-charts
        if: steps.ctx.outputs.skip != 'true' && steps.builds.outputs.skip != 'true'
        run: |
          cd helm-charts
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add charts/geoquery/Chart.yaml charts/geoquery/values.yaml
          # Nothing staged means the chart already says what we want it to say
          # -- a duplicate deploy for the same commit. That is success, not the
          # non-zero exit git would otherwise give us.
          if git diff --cached --quiet; then
            echo "helm-charts already at ${{ steps.ctx.outputs.version }} with these images — nothing to push."
            exit 0
          fi
          git commit -m "chore: bump geoquery chart to ${{ steps.ctx.outputs.version }} (backend ${{ steps.builds.outputs.backend_sha_short }}, frontend ${{ steps.builds.outputs.frontend_sha_short }})"
          git push

      - name: Checkout nova-fluxcd
        if: steps.ctx.outputs.skip != 'true' && steps.builds.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: aiddata/nova-fluxcd
          token: ${{ secrets.DEPLOY_TOKEN }}
          path: nova-fluxcd

      - name: Determine overlay path
        if: steps.ctx.outputs.skip != 'true' && steps.builds.outputs.skip != 'true'
        id: overlay
        run: |
          BRANCH="${{ steps.ctx.outputs.branch }}"
          OVERLAY="$( [ "$BRANCH" = "main" ] && echo "prod" || echo "$BRANCH" )"
          KUST_PATH="geoquery/app/overlays/${OVERLAY}/kustomization.yaml"
          if [ ! -f "nova-fluxcd/${KUST_PATH}" ]; then
            echo "ERROR: overlay not found: ${KUST_PATH}"
            exit 1
          fi
          echo "overlay=${OVERLAY}" >> $GITHUB_OUTPUT
          echo "path=${KUST_PATH}" >> $GITHUB_OUTPUT

      - name: Update kustomization.yaml
        if: steps.ctx.outputs.skip != 'true' && steps.builds.outputs.skip != 'true'
        run: |
          python3 - <<'PYEOF'
          import re, os, sys
          version = os.environ['VERSION']
          path = os.path.join('nova-fluxcd', os.environ['KUST_PATH'])
          content = open(path).read()
          # Count the substitutions rather than comparing before/after text.
          # "No change" and "pattern missing" are different outcomes: rewriting
          # 0.46.0 over an existing 0.46.0 also leaves the text identical, and
          # the old check called that a missing pattern and failed the deploy.
          updated, hits = re.subn(
              r'(path: /spec/chart/spec/version\s*\n\s*value: ")[^"]*"',
              rf'\g<1>{version}"',
              content,
          )
          if hits == 0:
              print(f"ERROR: version pattern not found in {path}", file=sys.stderr)
              sys.exit(1)
          if updated == content:
              print(f"{path} already pins {version} — nothing to change.")
              sys.exit(0)
          open(path, 'w').write(updated)
          print(f"Updated {path} → {version}")
          PYEOF
        env:
          VERSION: ${{ steps.ctx.outputs.version }}
          KUST_PATH: ${{ steps.overlay.outputs.path }}

      - name: Commit and push nova-fluxcd
        if: steps.ctx.outputs.skip != 'true' && steps.builds.outputs.skip != 'true'
        run: |
          cd nova-fluxcd
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.overlay.outputs.path }}"
          if git diff --cached --quiet; then
            echo "${{ steps.overlay.outputs.overlay }} overlay already pins ${{ steps.ctx.outputs.version }} — nothing to push."
            exit 0
          fi
          git commit -m "chore: deploy geoquery ${{ steps.ctx.outputs.version }} to ${{ steps.overlay.outputs.overlay }}"
          git push
