name: Documentation
on:
  push:
    branches:
      - main
      - dev
      - sgoodm
      - jwhall
    paths:
      - docs/**
      - zensical.toml
      - overrides/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/docs.yml
      - .github/scripts/**
  # The data pages are regenerated in the cluster at 05:00 UTC
  # (build-data-docs in the backend's beat schedule); pick them up an hour later.
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
permissions:
  contents: read
# One Pages site serves docs.geoquery.org, so only main publishes to it. Other
# branches build the docs as a check (broken links, bad config) and stop there;
# before this, a push to dev or a personal branch replaced the live docs.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --only-group docs
      # Point the docs' "Open GeoQuery" link at another app (a new domain, a
      # staging site) by setting the GEOQUERY_APP_URL Actions variable;
      # unset, zensical.toml's app_url is used.
      - name: Set app URL
        if: ${{ vars.GEOQUERY_APP_URL != '' }}
        env:
          GEOQUERY_APP_URL: ${{ vars.GEOQUERY_APP_URL }}
        run: sed -i "s|^app_url = .*|app_url = \"$GEOQUERY_APP_URL\"|" zensical.toml
      - name: Test the data docs fetch script
        run: uv run --only-group docs python -m unittest discover -s .github/scripts -p 'test_*.py'
      # The dataset and boundary pages aren't in git: they're generated nightly
      # in the cluster and served by the app. Fails rather than build without them.
      - name: Fetch generated data pages
        run: uv run --only-group docs python .github/scripts/fetch_data_docs.py
      - run: uv run --only-group docs zensical build --clean --strict
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
