name: Build frontend container
# Only runs when the frontend actually changes, so the two images routinely
# sit at different commits. The deploy handles that by carrying forward
# whichever image did not rebuild (see deploy.yml) rather than looking it up.
#
# Touching this file is also the way to force a rebuild deliberately -- it is
# in the path filter below. Useful when the published image needs to be
# regenerated without an application change.
on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/build-frontend.yaml"
jobs:
  build:
    name: Build Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Get Short Commit SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Check outputs
        run: echo ${{ steps.vars.outputs.sha_short }}

      - name: Buildah Action
        uses: redhat-actions/buildah-build@v2
        with:
          context: .
          image: geoquery-frontend
          tags: ${{ steps.vars.outputs.sha_short }}
          containerfiles: |
            ./frontend/Containerfile
          oci: true

      - name: Push Image
        uses: redhat-actions/push-to-registry@v2
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io/${{ github.repository_owner }}
          image: geoquery-frontend
          tags: ${{ steps.vars.outputs.sha_short }}
