[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# This is a Django project, not an importable library: everything runs from the
# backend/ directory via manage.py, so nothing needs to land in site-packages.
# Without this, setuptools' flat-layout autodiscovery sees each Django app
# directory as a top-level package and refuses to build.
packages = []


[project]
name = "geoquery-backend"
description = "Django backend for GeoQuery"
authors = [
    { name = "Seth Goodman", email = "sgoodman@aiddata.wm.edu" },
    { name = "Jacob Hall", email = "jhall@aiddata.wm.edu" },
]
readme = "README.md"
keywords = ["geoquery", "geospatial", "gis", "geographic"]
dynamic = ["version"]
license = "BSD-3-Clause"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Utilities",
    "Topic :: Scientific/Engineering :: GIS",
]
requires-python = ">=3.12"
dependencies = [
    "pyarrow>=24.0.0",
    "pyproj",
    "geopandas",
    "shapely",
    "rasterio",
    "rasterstats @ git+https://github.com/aiddata/geoquery-python-rasterstats@80ab2f2a01d0aa99d935ca7fe7ed422b9f52f9b7",
    "loguru",
    "numpy",
    "pandas",
    "django>=5.2.15,<6",
    "uvicorn[standard]>=0.35",
    "psycopg2-binary>=2.9.10",
    "djangorestframework>=3.16.1",
    "djangorestframework-gis>=1.2.0",
    "django-cors-headers>=4.9.0",
    "drf-spectacular>=0.27.0",
    "celery[librabbitmq]>=5.4",
    "lzstring>=1.0.4",
    "django-celery-results>=2.6.0",
    "django-prometheus>=2.5.0",
    "whitenoise[brotli]>=6.12.0",
    "django-allauth[socialaccount]>=65.18.0",
    "django-guardian>=3.3.3",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[dependency-groups]
# Duplicated from root pyproject.toml: "uv sync --package geoquery-backend"
# (see Containerfile) only reads dependency-groups declared on this member's
# own pyproject.toml, not the workspace root's — don't remove this copy.
test = ["stac-pydantic>=3.0"]

[tool.uv]
default-groups = ["test"]

[tool.isort]
profile = "black"
