# Boundary Presets Configuration
#
# A preset selects several boundary sets at once. It appears in the boundary
# search (Explore) and on Browse All; choosing it adds each of its boundary
# sets to the selection. It is purely a selection shortcut: nothing about
# extraction or processing depends on it.
#
# Two kinds:
#
# 1. Rule presets match boundary sets by their metadata. All given fields
#    are AND-ed together:
#    - source_name / group_class: exact match (null or omitted = any)
#    - group_level: exact match (null or omitted = any)
#    - tags: the set has ALL of these
#    - any_tags: the set has AT LEAST ONE of these
#    - exclude_tags: the set has NONE of these
#    Pin a release with its tag (e.g. geoboundaries_v6) so sets from different
#    releases never mix.
#
# 2. List presets name their boundary sets exactly, in `members` (boundary set
#    names, e.g. gB_57dcd43_USA_ADM1). When `members` is given the rule fields
#    are ignored. Names that don't exist, or aren't available to the user, are
#    skipped.
#
# Either kind can have `aliases`: other names the boundary search matches, e.g.
# "Central America" or "NA ADM1".

presets:
  - name: "geoBoundaries ADM0"
    aliases: ["global ADM0"]
    description: "All geoBoundaries administrative level 0 (national)"
    source_name: "geoBoundaries"
    group_class: null
    group_level: 0
    tags: ['geoboundaries', 'geoboundaries_v6']
    sort_order: 1

  - name: "geoBoundaries ADM1"
    aliases: ["global ADM1"]
    description: "All geoBoundaries administrative level 1 (state/region)"
    source_name: "geoBoundaries"
    group_class: null
    group_level: 1
    tags: ['geoboundaries', 'geoboundaries_v6']
    sort_order: 2

  - name: "geoBoundaries ADM2"
    aliases: ["global ADM2"]
    description: "All geoBoundaries administrative level 2 (district)"
    source_name: "geoBoundaries"
    group_class: null
    group_level: 2
    tags: ['geoboundaries', 'geoboundaries_v6']
    sort_order: 3

  # Regional presets: geoBoundaries v6 sets for each country in a region.
