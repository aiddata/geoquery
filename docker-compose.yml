services:
  db:
    image: postgis/postgis:17-master
    environment:
      - POSTGRES_DB=geoquery
      - POSTGRES_USER=django_user
      - POSTGRES_PASSWORD=dev_password
    volumes:
      - pgdata:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3.13-management-alpine

  backend:
    build:
      context: .
      dockerfile: backend/Containerfile
    # Shared with `mcp`, `worker-*` and `beat`: they are the same image with
    # different entrypoints. Naming it explicitly means Compose builds and
    # exports it once, instead of writing a ~20 GB copy per service.
    image: geoquery-backend
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    command: uv run python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./requests:/requests
      - type: bind
        source: ./data
        target: /data
        bind:
          create_host_path: false
    environment:
      - DJANGO_DEBUG=true
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - DB_HOST=db
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,backend
      - EXTRACT_TASK_BUILD_INTERVAL_SECONDS=${EXTRACT_TASK_BUILD_INTERVAL_SECONDS:-600}
      - EXTRACT_TASK_BUILD_BATCH_SIZE=${EXTRACT_TASK_BUILD_BATCH_SIZE:-5000}
      - EXTRACT_TASK_BUILD_MAX_TASKS=${EXTRACT_TASK_BUILD_MAX_TASKS:-0}
      - REQUESTS_DIR=/requests
      - STATS_REPORT_INTERVAL_SECONDS=${STATS_REPORT_INTERVAL_SECONDS:-3600}
      - DOWNLOAD_BASE_URL=${DOWNLOAD_BASE_URL:-http://localhost:8000}
      # Bare key, no default: Compose omits the variable entirely when it is
      # unset, which lets settings.py tell "unset" (inherit DOWNLOAD_BASE_URL)
      # apart from "set to empty" (render no download link at all).
      - LEGACY_DOWNLOAD_BASE_URL
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL:-http://localhost:5173}
      - PROTOMAPS_API_KEY=${PROTOMAPS_API_KEY}
      - GITHUB_GIST_TOKEN=${GITHUB_GIST_TOKEN}
      - GITHUB_OAUTH_CLIENT_ID=${GITHUB_OAUTH_CLIENT_ID}
      - GITHUB_OAUTH_CLIENT_SECRET=${GITHUB_OAUTH_CLIENT_SECRET}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      # RSA key GeoQuery's OIDC provider signs MCP sign-in tokens with.
      # Generate one with `openssl genrsa 2048`. Only needed to connect a chat
      # client to the MCP server.
      - OIDC_PRIVATE_KEY=${OIDC_PRIVATE_KEY}
      - MCP_BASE_URL=${MCP_BASE_URL:-http://localhost:8001}
      - MCP_OIDC_CLIENT_ID=${MCP_OIDC_CLIENT_ID}
      - MCP_OIDC_CLIENT_SECRET=${MCP_OIDC_CLIENT_SECRET}
      - PG_RW_DBNAME=geoquery
      - PG_RW_USER=django_user
      - PG_RW_PASSWORD=dev_password
      - PG_RW_HOST=db
      - PG_RW_PORT=5432
      - PG_SSL_MODE=disable
    depends_on:
      - db
      - rabbitmq

  mcp:
    # Same image as `backend`, different entrypoint: the MCP server is a second
    # front end onto the same database, not a separate application. It needs no
    # /data mount (it never touches rasters) but does need /requests, because it
    # serves finished export results.
    build:
      context: .
      dockerfile: backend/Containerfile
    image: geoquery-backend
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    command: uv run python manage.py run_mcp
    ports:
      - "8001:8001"
    volumes:
      - ./backend:/app/backend
      - ./requests:/requests
    environment:
      - DJANGO_DEBUG=true
      - DB_HOST=db
      - REQUESTS_DIR=/requests
      - DOWNLOAD_BASE_URL=${DOWNLOAD_BASE_URL:-http://localhost:8000}
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL:-http://localhost:5173}
      - PROTOMAPS_API_KEY=${PROTOMAPS_API_KEY}
      # The URL a chat client reaches this server at. With a tunnel in front
      # (cloudflared, ngrok) set it to the public URL -- the OAuth callback and
      # the protected-resource metadata are built from it.
      - MCP_BASE_URL=${MCP_BASE_URL:-http://localhost:8001}
      # This server's client on GeoQuery's own OIDC provider. Register it
      # with `docker compose exec backend uv run python manage.py
      # ensure_mcp_oidc_client` after setting these.
      - MCP_OIDC_CLIENT_ID=${MCP_OIDC_CLIENT_ID}
      - MCP_OIDC_CLIENT_SECRET=${MCP_OIDC_CLIENT_SECRET}
      # Where this process reaches the provider's token, revocation and JWKS
      # endpoints. The browser-facing /authorize URL comes from
      # FRONTEND_BASE_URL instead, since the browser cannot resolve `backend`.
      - MCP_OIDC_INTERNAL_URL=${MCP_OIDC_INTERNAL_URL:-http://backend:8000}
      - MCP_JWT_SIGNING_KEY=${MCP_JWT_SIGNING_KEY}
      # Set to true to skip sign-in entirely (every caller anonymous).
      - MCP_AUTH_DISABLED=${MCP_AUTH_DISABLED:-false}
      # FastMCP's home directory. The OAuth proxy's state is in Postgres
      # (mcp_oauth_state), but FastMCP still expects a writable home; /tmp is
      # the one path any runtime UID can write, same reason the Containerfile
      # puts the uv cache there.
      - FASTMCP_HOME=/tmp/fastmcp
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - PG_RW_DBNAME=geoquery
      - PG_RW_USER=django_user
      - PG_RW_PASSWORD=dev_password
      - PG_RW_HOST=db
      - PG_RW_PORT=5432
      - PG_SSL_MODE=disable
    depends_on:
      - db
      - rabbitmq

  worker-processing:
    build:
      context: .
      dockerfile: backend/Containerfile
    image: geoquery-backend
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    command: uv run python manage.py run_extract_worker --concurrency 2
    volumes:
      - ./backend:/app/backend
      - type: bind
        source: ./data
        target: /data
        read_only: true
        bind:
          create_host_path: false
      - ./requests:/requests
    environment:
      - DJANGO_DEBUG=true
      - DB_HOST=db
      - REQUESTS_DIR=/requests
      - DOWNLOAD_BASE_URL=${DOWNLOAD_BASE_URL:-http://localhost:8000}
      - PG_RW_DBNAME=geoquery
      - PG_RW_USER=django_user
      - PG_RW_PASSWORD=dev_password
      - PG_RW_HOST=db
      - PG_RW_PORT=5432
      - PG_SSL_MODE=disable
      - WORKER_METRICS_PORT=9091
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus-multiproc
    depends_on:
      - db

  worker-background:
    build:
      context: .
      dockerfile: backend/Containerfile
    image: geoquery-backend
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    command: uv run celery -A geoquery worker -Q background --loglevel=info
    volumes:
      - ./backend:/app/backend
      - ./requests:/requests
      - ./assets:/assets
    environment:
      - BACKGROUND_METRICS_PORT=9091
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus-background
      - DJANGO_DEBUG=true
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - DB_HOST=db
      - REQUESTS_DIR=/requests
      - STATS_REPORT_INTERVAL_SECONDS=${STATS_REPORT_INTERVAL_SECONDS:-3600}
      - ASSETS_DIR=/assets
      - EXTRACT_TASK_BUILD_INTERVAL_SECONDS=${EXTRACT_TASK_BUILD_INTERVAL_SECONDS:-600}
      - EXTRACT_TASK_BUILD_BATCH_SIZE=${EXTRACT_TASK_BUILD_BATCH_SIZE:-5000}
      - EXTRACT_TASK_BUILD_MAX_TASKS=${EXTRACT_TASK_BUILD_MAX_TASKS:-0}
      - DOWNLOAD_BASE_URL=${DOWNLOAD_BASE_URL:-http://localhost:8000}
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL:-http://localhost:5173}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - GITHUB_GIST_TOKEN=${GITHUB_GIST_TOKEN}
      - PG_RW_DBNAME=geoquery
      - PG_RW_USER=django_user
      - PG_RW_PASSWORD=dev_password
      - PG_RW_HOST=db
      - PG_RW_PORT=5432
      - PG_SSL_MODE=disable
    depends_on:
      - db
      - rabbitmq

  beat:
    build:
      context: .
      dockerfile: backend/Containerfile
    image: geoquery-backend
    command: uv run celery -A geoquery beat --loglevel=info
    volumes:
      - ./backend:/app/backend
    environment:
      - DJANGO_DEBUG=true
      - STATS_REPORT_INTERVAL_SECONDS=${STATS_REPORT_INTERVAL_SECONDS:-3600}
      - EXTRACT_TASK_BUILD_INTERVAL_SECONDS=${EXTRACT_TASK_BUILD_INTERVAL_SECONDS:-600}
      - EXTRACT_TASK_BUILD_BATCH_SIZE=${EXTRACT_TASK_BUILD_BATCH_SIZE:-5000}
      - EXTRACT_TASK_BUILD_MAX_TASKS=${EXTRACT_TASK_BUILD_MAX_TASKS:-0}
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - DB_HOST=db
      - PG_RW_DBNAME=geoquery
      - PG_RW_USER=django_user
      - PG_RW_PASSWORD=dev_password
      - PG_RW_HOST=db
      - PG_RW_PORT=5432
      - PG_SSL_MODE=disable
    depends_on:
      - db
      - rabbitmq

  frontend:
    build:
      context: .
      dockerfile: frontend/Containerfile
      target: dev
    command: bun run dev --host
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./docs:/app/docs
    environment:
      - API_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  pgdata:
