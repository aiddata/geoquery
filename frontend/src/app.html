<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// GeoQuery's layouts need at least 1024 CSS px (the customize page's
			// three columns). On narrower devices -- phones, small tablets -- lay
			// the page out at 1024px and let the browser zoom out to fit, instead
			// of squeezing layouts below what they support. --device-scale lets the
			// small-screen notice (SmallScreenNotice.svelte) scale its text back up.
			// Keep in step with MIN_LAYOUT_WIDTH in lib/smallScreen.ts.
			(function () {
				var MIN = 1024;
				var meta = document.querySelector('meta[name="viewport"]');
				function apply() {
					var w = window.screen.width;
					// Touch devices only: a desktop's reported screen size says
					// nothing about its window, which layout.css handles instead.
					var narrow = w < MIN && window.matchMedia('(pointer: coarse)').matches;
					meta.setAttribute('content', narrow ? 'width=' + MIN : 'width=device-width, initial-scale=1');
					document.documentElement.style.setProperty('--device-scale', narrow ? String(MIN / w) : '1');
					document.documentElement.toggleAttribute('data-narrow-device', narrow);
				}
				apply();
				window.addEventListener('orientationchange', apply);
			})();
		</script>
		<script>
			// Apply the saved theme before first paint (lib/stores/theme.ts owns it afterwards)
			try {
				var t = localStorage.getItem('gq-theme');
				if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
			} catch (e) {}
		</script>
		<!-- MapLibre fetches basemap tiles, glyphs and sprites in CORS mode, hence crossorigin -->
		<link rel="preconnect" href="https://api.protomaps.com" crossorigin />
		<link rel="preconnect" href="https://protomaps.github.io" crossorigin />
		%sveltekit.head%
		<!-- Google tag (gtag.js) -->
		<script async src="https://www.googletagmanager.com/gtag/js?id=G-XZ0HS7XED1"></script>
		<script>
			window.dataLayer = window.dataLayer || [];
			function gtag(){dataLayer.push(arguments);}
			gtag('js', new Date());
			// send_page_view: false — SvelteKit is a SPA; pageviews are fired via afterNavigate in +layout.svelte
			gtag('config', 'G-XZ0HS7XED1', { send_page_view: false });
		</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
